# project 名を固定する。volume 名（mlflow-server_db_store など）がここから決まるので、
# フォルダを移しても記録（postgres・minio）を引き継ぐために必ず残す。
name: mlflow-server

services:

  postgres:
    image: postgres:16
    container_name: c_postgres
    volumes:
      - db_store:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    restart: always
    networks:
      - mlflow-net-test

  minio:
    # MinIO の代替。Docker Hub の minio/minio は配布结束的したため rustfs を使う。
    # S3 API と環境変数（MINIO_ROOT_USER / MINIO_ROOT_PASSWORD）は MinIO と同じ。
    # ヘルスチェックの /minio/health/live も同じパスで通る。
    image: rustfs/rustfs:latest
    container_name: c_minio
    command: ["rustfs", "/data"]
    volumes:
      - minio_store:/data
    environment:
      RUSTFS_VOLUMES: /data
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # 9000 は直接方式の S3 API。LAN の PC から直接書くので 0.0.0.0 に出す。
      - "9000:9000"
      # 9001 は MinIO コンソール。Mac の中だけ。
      - "127.0.0.1:9001:9001"
    restart: always
    networks:
      - mlflow-net-test

  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION}
    container_name: c_mlflow
    ports:
      # 5000 番は Mac の AirPlay レシーバーが使っているので 5001 に割り当てる。
      # コンテナの中のポートは 5000 のまま。
      - "127.0.0.1:5001:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_BASIC_USER}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_BASIC_PASSWORD}
      MLFLOW_ALLOWED_HOSTS: "*"
    depends_on:
      - postgres
      - minio
    restart: always
    networks:
      - mlflow-net-test

  caddy:
    image: caddy:2-alpine
    container_name: c_caddy
    ports:
      - "8443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      # 平文は Caddyfile に書かない。ハッシュだけ渡す。
      MLFLOW_BASIC_USER: ${MLFLOW_BASIC_USER}
      MLFLOW_BASIC_PASSWORD_HASH: ${MLFLOW_BASIC_PASSWORD_HASH}
    depends_on:
      - mlflow
    restart: always
    networks:
      - mlflow-net-test

  # docker compose run --rm init  （profiles なので通常起動では動かない）
  init:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION}
    container_name: c_init
    entrypoint: ["python", "/work/scripts/init_experiments.py"]
    volumes:
      - ./scripts:/work/scripts:ro
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      - mlflow
      - minio
    profiles:
      - init
    networks:
      - mlflow-net-test

  # docker compose run --rm smoke  （profiles なので通常起動では動かない）
  smoke:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION}
    container_name: c_smoke
    entrypoint: ["python", "/work/scripts/smoke_test.py"]
    volumes:
      - ./scripts:/work/scripts:ro
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      - mlflow
      - minio
    profiles:
      - smoke
    networks:
      - mlflow-net-test

  # docker compose run --rm checkenv  （profiles なので自動起動はしない）
  checkenv:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION}
    container_name: c_checkenv
    entrypoint: ["python", "/work/scripts/check_env.py"]
    volumes:
      - ./scripts:/work/scripts:ro
    environment:
      MLFLOW_VERSION: ${MLFLOW_VERSION}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MLFLOW_BASIC_USER: ${MLFLOW_BASIC_USER}
      MLFLOW_BASIC_PASSWORD: ${MLFLOW_BASIC_PASSWORD}
      MLFLOW_BASIC_PASSWORD_HASH: ${MLFLOW_BASIC_PASSWORD_HASH}
    profiles:
      - checkenv
    networks:
      - mlflow-net-test

networks:
  # integration_test も同じ名前（external）で参照しているため改名しない。
  mlflow-net-test:
    external: true

volumes:
  db_store:
  minio_store:
  caddy_data:

# データごと消すとき: docker compose down -v
