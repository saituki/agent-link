[project]
name = "sai-web"
version = "0.1.0"
description = "外出先のiPhoneから自宅Macの coding agent を監視・操作するアプリ (Mac側サーバー)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "pywebpush>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sai_web*"]
