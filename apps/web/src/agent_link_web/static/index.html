<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>agent-link</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <!-- 画面ファイルの版（サフィックスの数字）は sw.js の CACHE の版と揃えて上げる（iPhone に古いファイルを使わせないため） -->
  <link rel="stylesheet" href="/style.css?v=135" />
  <!-- md の色・ホーム・Workflow・設定の見た目（U4〜U6）。style.css の後に読む -->
  <link rel="stylesheet" href="/markdown.css?v=135" />
  <link rel="stylesheet" href="/home.css?v=135" />
  <link rel="stylesheet" href="/workflow.css?v=135" />
  <link rel="stylesheet" href="/defs.css?v=135" />
</head>
<body>
  <!-- 日付一覧画面（#/） -->
  <section id="view-days" class="view">
    <header class="appbar">
      <!-- 見出しはタブ名に合わせる（05 §4） -->
      <h1>Chats</h1>
      <button id="newchat-button" aria-label="New chat">＋</button>
      <button id="version-button" aria-label="Show version">ⓘ</button>
      <button id="notify-button" aria-label="Turn on notifications">🔔</button>
      <button id="search-toggle" aria-label="Search">🔍</button>
    </header>
    <div id="offline-bar-days" class="offline-bar" hidden>Cannot connect</div>
    <div id="search-row" class="search-row" hidden>
      <input type="search" id="search-input" placeholder="Filter by description, block, or project" />
    </div>
    <main id="days-list" class="groups"></main>
  </section>

  <!-- 日ごとの実行一覧画面（#/day/2026-09-23） -->
  <section id="view-day" class="view" hidden>
    <header class="appbar">
      <button id="day-back" aria-label="Back">‹</button>
      <h1 id="day-title">Date</h1>
    </header>
    <div id="offline-bar-day" class="offline-bar" hidden>Cannot connect</div>
    <!-- 広い画面では左に日付一覧・右にその日の実行（U4 §4）。
         狭い画面では左（sai-split-list）は隠して右だけを出す。 -->
    <div class="sai-split" id="day-split">
      <div class="sai-split-list" id="day-side"></div>
      <main id="day-list" class="sai-split-main groups"></main>
    </div>
  </section>

  <!-- 実行（メッセージ）画面（#/run/agent-link-web/58） -->
  <section id="view-run" class="view" hidden>
    <header class="appbar">
      <button id="back-button" aria-label="Back">‹</button>
      <!-- 見出し1行目 #run_id block_name，2行目に description（03 §1-7） -->
      <div class="run-heading">
        <h1 id="run-title">Run</h1>
        <div id="run-desc" class="run-desc"></div>
      </div>
      <span id="run-lamp" class="lamp" aria-label="Status"></span>
      <!-- ■ 終了（実行中のメインブロックだけ出す・計画書 A の D2） -->
      <button id="finalize-button" aria-label="End run" hidden>■</button>
      <!-- 統計画面へのボタン（中身は 04。住所だけは 03 で用意・03 §1-7） -->
      <button id="stats-button" aria-label="Stats">📊</button>
    </header>
    <div id="offline-bar-run" class="offline-bar" hidden>Cannot connect</div>
    <main id="chat-list" class="chat-list"></main>
    <button id="new-arrival" class="new-arrival" hidden>New ↓</button>
    <footer class="inputbar">
      <button id="mic-button" aria-label="Voice input">🎤</button>
      <textarea id="chat-input" rows="1" placeholder="Type a message"></textarea>
      <!-- 停止（working と blocked のときだけ出す・U03）。文字は ■ だけ（幅 390px で入力欄を狭くしすぎないため） -->
      <button id="interrupt-button" class="stop-button" aria-label="Stop" title="Stop the agent's current work (the chat continues)" hidden>■</button>
      <button id="send-button" aria-label="Send">➤</button>
    </footer>
  </section>

  <!-- 実行の統計画面（#/run/agent-link-web/58/stats・04） -->
  <section id="view-stats" class="view" hidden>
    <header class="appbar">
      <button id="stats-back" aria-label="Back">‹</button>
      <div class="run-heading">
        <h1 id="stats-title">Stats</h1>
        <div id="stats-desc" class="run-desc"></div>
      </div>
      <span id="stats-lamp" class="lamp" aria-label="Status"></span>
    </header>
    <div id="offline-bar-stats" class="offline-bar" hidden>Cannot connect</div>
    <main class="stats-body">
      <!-- 見出し（#58 sai2・description・プロジェクト・runner・モデル・時刻・状態） -->
      <div id="stats-head" class="st-head"></div>
      <!-- 大きな数字3つ・円グラフ・棒グラフ・補足行（中身は stats.js・04 §1） -->
      <div id="stats-cards"></div>
    </main>
  </section>

  <!-- Project タブの一覧画面（#/projects・06） -->
  <section id="view-projects" class="view" hidden>
    <header class="appbar">
      <h1>Project</h1>
    </header>
    <div class="offline-bar" hidden>Cannot connect</div>
    <main id="projects-list" class="groups"></main>
  </section>

  <!-- Project のカード型 Dashboard（#/project/<name>・06） -->
  <section id="view-dashboard" class="view" hidden>
    <!-- 見出しは ‹ プロジェクト名 Dashboard|Workflow|List|設定（4 画面共通・U01 §3） -->
    <header class="appbar proj-bar">
      <button id="dash-back" class="proj-back" aria-label="Back to projects">‹</button>
      <h1 id="dash-title" class="proj-title">Project</h1>
      <!-- Dashboard / Workflow / List / 設定 の切り替え（中身は linkview.js の fillLinkSeg） -->
      <div class="list-mode" id="dash-mode-seg"></div>
      <span id="dash-lamp" class="proj-lamp" aria-label="Daemon status"></span>
    </header>
    <div class="offline-bar" hidden>Cannot connect</div>
    <main id="dashboard-body" class="dash-body"></main>
  </section>

  <!-- Project の List 画面（#/project/<name>/list・計画 14 §1.2） -->
  <section id="view-list" class="view" hidden>
    <!-- 見出しは ☰（狭い画面だけ）‹ プロジェクト名 切り替え（4 画面共通・U01 §3） -->
    <header class="appbar proj-bar list-bar">
      <!-- ☰ で左から引き出しツリー（計画 14 §1.2） -->
      <button id="list-menu" aria-label="Open tree">☰</button>
      <button id="list-back" class="proj-back" aria-label="Back to projects">‹</button>
      <h1 id="list-title" class="proj-title"></h1>
      <!-- Dashboard / Workflow / List / 設定 の切り替え（同じ見た目・中身は linkview.js が作る） -->
      <div class="list-mode" id="list-mode-seg"></div>
    </header>
    <div class="offline-bar" hidden>Cannot connect</div>
    <!-- 選んだ run の見出しと 7 つの表示の帯（run を選ぶまで隠す・計画 14 §1.3） -->
    <div class="lv-head" id="lv-head" hidden>
      <div class="lv-run-row">
        <span class="lv-run-label" id="lv-run-label"></span>
        <span class="lv-run-state" id="lv-run-state"></span>
      </div>
      <!-- 帯は横にスクロールできる（計画 14 §1.3） -->
      <div class="lv-tabs" id="lv-tabs"></div>
      <!-- todo の run の ▶ 実行と 1 行の知らせ（計画 14 §1.3） -->
      <div class="lv-actions" id="lv-actions"></div>
      <div class="lv-msg" id="lv-msg" hidden></div>
    </div>
    <!-- 選んだ中身（Log / Stats / History / task / review / message / waggle・計画 14） -->
    <main class="lv-body" id="lv-body"></main>
    <!-- 引き出し式ツリー（暗い部分タップで閉じる・計画 14 §1.2） -->
    <div class="lv-drawer-wrap" id="lv-drawer-wrap" hidden>
      <div class="lv-drawer-mask" id="lv-drawer-mask"></div>
      <nav class="lv-drawer" id="lv-drawer" aria-label="Run tree"></nav>
    </div>
  </section>

  <!-- 会話の検索の画面（#/project/<name>/sessions・U10） -->
  <section id="view-sessions" class="view" hidden>
    <header class="appbar proj-bar">
      <button id="sess-back" class="proj-back" aria-label="Back to projects">‹</button>
      <h1 id="sess-title" class="proj-title"></h1>
      <div class="list-mode" id="sess-mode-seg"></div>
    </header>
    <div class="offline-bar" hidden>Cannot connect</div>
    <main id="sess-body" class="sess-body"></main>
  </section>


  <!-- ホーム（#/home。中身は home.js・U4） -->
  <section id="view-home" class="view" hidden><div id="home-root"></div></section>

  <!-- Workflow 盤面（#/project/<name>/workflow。中身は workflow.js・U5） -->
  <section id="view-workflow" class="view" hidden><div id="workflow-root"></div></section>

  <!-- 設定（#/project/<name>/defs…・中身は defs.js・U5） -->
  <section id="view-defs" class="view" hidden><div id="defs-root"></div></section>

  <!-- task.md 作成フォーム（下から出る一枚・計画 15 §1.5。中身は cardform.js） -->
  <div id="cardform-wrap" class="cf-wrap" hidden>
    <div class="cf-mask" id="cf-mask"></div>
    <div class="cf-sheet" role="dialog" aria-modal="true" aria-label="Create task.md">
      <div class="cf-head">
        <div class="cf-head-text">
          <!-- 手順番号は 10 固定で，スキップすると番号が飛ぶ（TUI と同じ・計画 15 §1.5） -->
          <span class="cf-step" id="cf-step"></span>
          <span class="cf-title" id="cf-name">Create task.md</span>
        </div>
        <div class="cf-head-actions">
          <!-- 書きかけを消して最初から（計画 15 §1.5） -->
          <button class="cf-text-btn" id="cf-restart">Restart</button>
          <button id="cf-close" aria-label="Close">×</button>
        </div>
      </div>
      <!-- settings.json の注意（options の warnings）とエラーの 1 行 -->
      <div class="cf-warn" id="cf-warn" hidden></div>
      <div class="cf-msg" id="cf-msg" hidden></div>
      <div class="cf-body" id="cf-body"></div>
      <div class="cf-foot">
        <button class="cf-btn" id="cf-back">‹ Back</button>
        <button class="cf-btn" id="cf-skip" hidden>Skip</button>
        <button class="cf-btn primary" id="cf-next">Next</button>
      </div>
    </div>
  </div>

  <!-- 画面下の重ね部：小さな再生バー＋タブバー（05 §4） -->
  <div id="bottom-stack" class="bottom-stack">
    <!-- 小さな再生バー（中身と表示の切り替えは 09） -->
    <div id="mini-player" class="mini-player" hidden></div>
    <nav id="tabbar" class="tabbar">
      <!-- 先頭はホーム（U4・表示名は日本語。data-tab と住所は変えない） -->
      <button data-tab="home" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- 家（屋根と本体） -->
          <path d="M3.5 11 12 4l8.5 7" />
          <path d="M5.5 10v9.5h13V10" />
        </svg>
        <span>Home</span>
      </button>
      <!-- アイコンは絵文字ではなく線で描いた SVG（05 §4） -->
      <button data-tab="project" aria-label="Projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- 四角が並んだ形（グリッド） -->
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
          <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
          <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" />
        </svg>
        <span>Projects</span>
      </button>
      <button data-tab="agent" aria-label="Chats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- 吹き出し -->
          <rect x="3.5" y="4.5" width="17" height="12" rx="3" />
          <path d="M8 16.5V20l4-3.5" />
        </svg>
        <span>Chats</span>
      </button>
    </nav>
  </div>

  <!-- md の整形表示（13 §1.4）。呼び出す画面部品より先に読み込む -->
  <script src="/markdown.js?v=135"></script>
  <!-- 共通部品（saiApi・saiToast など・U4）。markdown.js の直後、各画面の JS より先に読む -->
  <script src="/ui.js?v=135"></script>
  <!-- stats.js を先に読み，app.js の route() が統計画面を開けるようにする -->
  <script src="/stats.js?v=135"></script>
  <!-- Project タブの中身（06）。app.js より前に読み込む（stats.js の関数を共有するため） -->
  <script src="/project.js?v=135"></script>
  <!-- List 画面（Dashboard | List の切り替え・引き出しツリー・7 つの表示・計画 14）。 -->
  <!-- project.js より後に読み，app.js より前に読む（登録は window.SaiRoutes・計画 14 §6） -->
  <script src="/linkview.js?v=135"></script>
  <!-- task.md 作成フォーム（＋ で下から出る・計画 15）。app.js より前に読む
       （🎤 は app.js の attachVoiceInput を実行時に呼ぶ） -->
  <script src="/cardform.js?v=135"></script>
  <!-- 会話の検索（U10） -->
  <script src="/sessionsearch.js?v=135"></script>
  <!-- 会話に行・回答済みカードを置く位置を決める関数（CP3 の直し）。app.js より前に読み込む -->
  <script src="/chatorder.js?v=135"></script>
  <!-- 新しいチャット（U04 §5）。app.js より前に読み込む（#newchat-button に結び付ける） -->
  <script src="/newchat.js?v=135"></script>
  <!-- 質問カードの読み上げ・音声回答（U01・voiceask.js）。app.js より前に読み込む -->
  <script src="/voiceask.js?v=135"></script>
  <!-- 配置・全体表示・拡大の純関数（canvaslayout.js）。workflow.js より先に読む -->
  <script src="/canvaslayout.js?v=135"></script>
  <!-- ホーム画面（U4・home.js）。app.js より前に読み込む（画面の登録は window.SaiRoutes） -->
  <script src="/home.js?v=135"></script>
  <!-- Workflow 盤面（U5・workflow.js）。U4 では空のファイルを作っただけ。canvaslayout.js の関数を使うので canvaslayout.js より後 -->
  <script src="/workflow.js?v=135"></script>
  <!-- 設定画面（U5・defs.js）。U4 では空のファイルを作っただけ -->
  <script src="/defs.js?v=135"></script>
  <script src="/app.js?v=135"></script>
</body>
</html>
