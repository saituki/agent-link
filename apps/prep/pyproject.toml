[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sai-prep"
version = "0.1.0"
description = "各自の Mac で論文 PDF を前処理（docling・翻訳）してサーバへ送る小さなアプリ"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sai-tree" }]
# 依存は標準ライブラリだけ。docling・pdf2zh・mlx-lm は別の `uv tool` の環境に入れ、CLI で呼ぶ。
dependencies = []

[project.scripts]
sai-prep = "sai_prep.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sai_prep"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]
