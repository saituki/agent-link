[project]
name = "sai-ts"
version = "0.1.0"
description = "人が時系列を見て判断し、その判断をイベントとして LLM agent に渡す道具 (sai-ts)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sai_ts*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
