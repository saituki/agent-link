[project]
name = "sai-radio"
version = "0.1.0"
description = "論文を音声で聞き、音声で質問できるアプリ (Mac側サーバー)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "podcast-creator>=0.12.0,<1",
    "esperanto>=2.25.1,<3",
    "ai-prompter>=0.4,<1",
    "langchain-core>=1.4.6,<2",
    "langchain-openai>=0.1.0,<1",
    "langgraph>=1.0.5,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sai_radio*"]
