# 新しい実行先の雛形。フォルダごと写して、名前を付け、enable を true にする。
# フォルダ名が実行先の名前（英数字と - _ だけ。先頭は英数字）。この `_example` は先頭が下線なので使われない。
name = "example"
description = "雛形（何もしない）"
kind = "example"
enable = false
max_jobs = 1

# この実行先だけで違う環境変数。実験のスクリプトが MLflow に届く場所は実行先ごとに違う。
#   Mac 本体      http://127.0.0.1:5001
#   LAN の別 PC   http://<Mac の IP>:8443（Caddy・Basic 認証。ユーザー名とパスワードは settings.json の env に書く）
[env]
# MLFLOW_TRACKING_URI = "http://192.168.0.10:8443"
