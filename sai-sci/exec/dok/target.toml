# さくらのクラウド 高火力 DOK（GPU コンテナ）で動かす実行先。
# 課金される（実行秒数）。有効にする前に SETUP.md を読み、`check` で認証を確かめること。
name = "dok"
description = "さくら 高火力 DOK（GPU コンテナ。課金あり。1 タスクだけ）"
kind = "dok"
enable = false
# DOK は同時に 1 タスクだけ
max_jobs = 1

[dok]
plan = "v100-32gb"
# 公開 image（レジストリの認証が要らない物）。uv は入っていないので、下の setup で入れる
image = "pytorch/pytorch:2.8.0-cuda12.6-cudnn9-runtime"
# 実行時間の上限（秒）と、コンテナを保持する秒数（limit_sec より小さいこと）。上限を過ぎると DOK が止める
limit_sec = 900
hold_sec = 780
# ssh の鍵（`python3 dok.py ssh-key` が作って DOK に登録する）
key = "~/.ssh/dok_key"
experiment = "dok"
# 秘密（SAKURA_API_ACCESS_TOKEN など）を書いたファイル。空なら環境変数（settings.json の env）から読む。
# 例: ~/.sai/dok.env（権限 600。Git に入れない）
env_file = ""
# コマンドの前にコンテナの中で実行する準備（1 行ずつ）
setup = ["pip install -q uv"]
# 送るコードの大きさの上限（MB）。超えたら断る（PTY にコードを流すので大きい物は向かない）
max_code_mb = 5

# MLflow の場所。DOK のコンテナから届く必要がある（SETUP.md の Tailscale Funnel など）。
# 認証の値（MLFLOW_BASIC_USER / MLFLOW_BASIC_PASSWORD）は settings.json の env か env_file に書く。
[env]
MLFLOW_TRACKING_URI = "https://<Mac の名前>.<tailnet>.ts.net"
