# CI: Rust と Web（JS・Python）のテストを回す。
# 命令は AGENTS.md の「テストと確認」と同じ物にそろえる（直すときは両方直す）。
# Linux（ubuntu-latest）で動かす。秘密の値・ネットワークに出る試験は使わない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 環境変数が混ざっていると History テスト 1 件が落ちるので env -u で外す
      - name: cargo test
        run: |
          env -u SAI_PROJECT_ROOT -u SAI_PARENT_RUN_ID -u SAI_BLOCK_NAME -u SAI_TARGET_NODE \
            perl -e 'alarm 1800; exec @ARGV' cargo test --workspace

  web:
    name: Web（JS・Python）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 仮想環境を作る
        run: (cd apps/web && uv sync)
      - name: JS のテスト
        run: for f in apps/web/tests/test_*.js; do node "$f" || exit 1; done
      - name: Python のテスト
        run: for f in apps/web/tests/test_*.py; do PYTHONPATH=apps/web/src apps/web/.venv/bin/python "$f" || exit 1; done
