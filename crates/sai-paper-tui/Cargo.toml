[package]
name = "sai-paper-tui"
description = "sai-paper-tui — TUI for Sai Paper (Rust, sai-paper-core integration)"
version.workspace = true
edition = "2024"
license.workspace = true
rust-version.workspace = true
readme = "README.md"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["papr-core/bundled-sqlite"]

[[bin]]
name = "sai-moon-paper-tui"
path = "src/main.rs"

[dependencies]
papr-core = { package = "sai-paper-core", path = "../sai-paper-core" }
anyhow.workspace = true
arboard.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
flate2.workspace = true
iana-time-zone.workspace = true
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
ratatui-image.workspace = true
image.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true
notify.workspace = true
num-traits.workspace = true
walkdir.workspace = true
thiserror.workspace = true
serde.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Afroz Saqlain <sqn3680@gmail.com>, Tanveer <tanveer642003@gmail.com>"
copyright = "2026, Afroz Saqlain <sqn3680@gmail.com>"
extended-description = "A keyboard-first terminal workspace for researchers."
section = "utility"
priority = "optional"
assets = [
    ["target/release/sai-moon-paper-tui", "usr/bin/sai-moon-paper-tui", "755"],
    ["LICENSE", "usr/share/licenses/sai-paper-tui/LICENSE", "644"],
    ["README.md", "usr/share/doc/sai-paper-tui/README.md", "644"]
]

[package.metadata.generate-rpm]
assets = [
    { source = "../../target/release/sai-moon-paper-tui", dest = "/usr/bin/sai-moon-paper-tui", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/sai-paper-tui/LICENSE", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/sai-paper-tui/README.md", mode = "644" }
]
