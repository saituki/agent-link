[package]
name = "sai-link-widgets"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Sai-Link ダッシュボード widget 群 — Project 画面（データ構造 + 描画）を sai-control-tui 等から再利用するためのクレート（L3）"
authors = ["Sai Contributors"]
license = "MIT OR Apache-2.0"

[lib]
name = "sai_link_widgets"
path = "src/lib.rs"

[dependencies]
# 描画系は ratatui のみ・DB アクセス（ビルダ関数用）は sai-link-engine に委譲する
ratatui = "0.29"
# ビルダ純関数（block_history / block_log / cache_stats / pane）が
# SaiStore・session 解析・herdr を使用するため path 依存を追加（engine は
# widgets に依存しないため循環は発生しない）
sai-link-engine = { path = "../sai-link-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
# 今週・今月の費用合計の期間判定（Project 画面。B02）に使用
chrono = "0.4"
# 実行グラフ（DAG）のデータ構造とレイアウト計算（workflow/ モジュール）
petgraph = "0.6"
