[package]
name = "sai-link-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Sai-TUI — ブロック定義ファイルのワークフロー可視化・実行 TUI"
authors = ["Sai Contributors"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "sai-moon-link-tui"
path = "src/main.rs"

[dependencies]
# sai-engine（ライブラリとして使用）
sai-link-engine = { path = "../sai-link-engine" }

# ダッシュボード widget 群（L3: Project 画面・テーマ・円グラフ）
sai-link-widgets = { path = "../sai-link-widgets" }

# TUI フレームワーク
# unstable-rendered-line-info: Paragraph::line_count で折り返し後行数を取得し、
# カーソル行・コードブロック行の背景を全行に揃えるために使う
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"

# グラフデータ構造
petgraph = "0.6"

# 非同期ランタイム
tokio = { version = "1", features = ["rt", "time"] }

# JSON 操作（セッション統計の表示など）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 全角文字幅計算（日本語描画用）
unicode-width = "0.2"

# 擬似端末（PTY）生成（対話コマンドをターミナル内で実行するため）
libc = "0.2"

# マークダウンレンダリング（History/Blocks モード用）
# default-features = false で不要な html/getopts 機能をオフにする
pulldown-cmark = { version = "0.13", default-features = false }

# 日時表示（Review テンプレートの frontmatter 用）
chrono = "0.4"

# ブロック定義 default 値の文字列化（CLI モードの入力フォーム用）
serde_yaml = "0.9"

# コードブロックの言語別シンタックスハイライト（md viewer 用）
syntect = "5"
[dev-dependencies]
tempfile = "3"
