# sai-moon — Cargo workspace
#
# 旧 sai-link（`~/workdir/Sai/sai-link`）と 旧 sai-paper（`~/workdir/Sai/sai-paper`）の
# クレートを 1 つのワークスペースに集約したもの。旧リポジトリは読み取り専用で、ここはコピー元。
#
# - crates/sai-link-engine : lib sai_link_engine — 実行エンジン（パース・デーモン・オーケストレーター）
# - crates/sai-link-cli    : bin sai-moon-link — CLI
# - crates/sai-link-view   : lib sai_link_view — Web と CLI が使う組み立て処理（描画は無い）
# - crates/sai-paper-core  : lib sai_paper_core — 検索/取得/解析/保存
# - crates/sai-paper-cli   : bin sai-moon-paper — スクリプト用 CLI
# - waggle/                : 独立 [workspace] を持つ vendor クレート群（exclude・名前維持）
#
# バイナリ名は PATH 上で旧 sai-link / sai-paper と衝突しないよう `sai-moon-*` にリネーム済み。
# ライブラリ crate 名（sai_link_engine / sai_link_view / sai_paper_core）は変更しない。

[workspace]
resolver = "2"
members = [
    "crates/sai-link-engine",
    "crates/sai-link-cli",
    "crates/sai-link-view",
    "crates/sai-paper-core",
    "crates/sai-paper-cli",
]
# waggle は独自 [workspace] を持つため除外（Cargo の構造制約）
exclude = ["waggle"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sai Contributors"]

# sai-paper 側のクレートが `X.workspace = true` で参照する依存。
[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
regex = "1"
dunce = "1.0"
iana-time-zone = "0.1"
quick-xml = { version = "0.38", features = ["serialize", "overlapped-lists"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "blocking", "json"] }
rusqlite = { version = "0.32", default-features = false, features = ["chrono", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
pulldown-cmark = "0.13"
syntect = { version = "5.2", features = ["default-fancy"] }
thiserror = "2.0"
url = "2.5"
walkdir = "2.5"
biblatex = "0.12"
dotenvy = "0.15"

# sai-paper 側クレートの `[lints] workspace = true` 用（sai-link 側は参照しない）。
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
